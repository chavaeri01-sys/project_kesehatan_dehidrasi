<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hubungi Kami - HydroHealth</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-700 font-sans antialiased flex flex-col min-h-screen">

  <!-- ================= NAVBAR ================= -->
  <nav class="bg-white/90 backdrop-blur-md fixed w-full z-50 top-0 left-0 border-b border-sky-100">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2 text-sky-600 font-extrabold text-xl">
        <i class="fa-solid fa-droplet text-sky-500"></i>
        <span>HydroHealth</span>
      </a>
      <div class="flex items-center gap-6 font-semibold text-slate-600">
        <a href="index.html" class="hover:text-sky-500 transition-colors">Beranda</a>
        <a href="about.html" class="hover:text-sky-500 transition-colors">Tentang (Edukasi)</a>
        <a href="service.html" class="hover:text-sky-500 transition-colors">Layanan & Fitur</a>
        <a href="contact.html" class="text-sky-500 font-bold border-b-2 border-sky-500 pb-1">Kontak</a>
      </div>
    </div>
  </nav>

  <!-- ================= MAIN CONTENT: KONTAK ================= -->
  <main class="flex-grow pt-24 pb-16 px-6">
    <section class="max-w-3xl mx-auto space-y-8">
      
      <!-- Section Title -->
      <div class="text-center space-y-3">
        <h1 class="text-3xl md:text-4xl font-extrabold text-slate-800">
          Hubungi Tim Kami
        </h1>
        <p class="text-slate-600">
          Punya pertanyaan seputar hidrasi tubuh atau kritik & saran? Kirimkan pesanmu di bawah ini.
        </p>
      </div>

      <!-- Contact Form -->
      <div class="bg-white p-8 rounded-3xl shadow-sm border border-sky-100 space-y-6">
        <form onsubmit="event.preventDefault(); alert('Pesan Anda berhasil terkirim!');" class="space-y-4">
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">Nama Lengkap</label>
            <input type="text" required placeholder="Masukkan nama Anda" class="w-full px-4 py-3 rounded-xl border border-sky-200 focus:outline-none focus:ring-2 focus:ring-sky-400">
          </div>
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">Email</label>
            <input type="email" required placeholder="nama@email.com" class="w-full px-4 py-3 rounded-xl border border-sky-200 focus:outline-none focus:ring-2 focus:ring-sky-400">
          </div>
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">Pesan / Pertanyaan</label>
            <textarea rows="4" required placeholder="Tulis pesan Anda di sini..." class="w-full px-4 py-3 rounded-xl border border-sky-200 focus:outline-none focus:ring-2 focus:ring-sky-400"></textarea>
          </div>
          <button type="submit" class="w-full py-4 bg-sky-500 hover:bg-sky-600 text-white font-bold rounded-xl shadow-md transition-colors">
            Kirim Pesan <i class="fa-solid fa-paper-plane ml-2"></i>
          </button>
        </form>
      </div>

    </section>
  </main>

  <!-- ================= FOOTER ================= -->
  <footer class="bg-sky-300/30 text-center py-6 text-slate-500 text-sm mt-auto">
    <p>© 2026 Edukasi Kesehatan Dehidrasi. All rights reserved.</p>
  </footer>

</body>
</html>
